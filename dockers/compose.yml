version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: dockers/Dockerfile
    container_name: resto_burger
    volumes:
      - symfony_data:/var/www
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/docker.conf
    networks:
      resto_network:
        ipv4_address: 172.28.0.20

  nginx:
    image: nginx:latest
    container_name: nginx_resto_burger
    ports:
      - "8000:80"
    volumes:
      - symfony_data:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      resto_network:
        ipv4_address: 172.28.0.30

  db:
    image: postgres:18-alpine
    container_name: resto_burger_db
    volumes:
      - db_data_resto:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: db_resto
    networks:
      resto_network:
        ipv4_address: 172.28.0.10

volumes:
  symfony_data:
  db_data_resto:

networks:
  resto_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
