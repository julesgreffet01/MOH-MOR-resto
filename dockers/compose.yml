services:
    db:
        image: postgres:18-alpine
        container_name: api-culteur-db
        shm_size: 128mb
        volumes:
            - db_data_resto:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: pwd
            POSTGRES_DB: db_resto
        ports:
            - "5430:5432"

volumes:
    db_data_resto:
