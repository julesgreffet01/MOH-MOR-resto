services:
    db:
        image: postgres:16-alpine
        container_name: resto_burger_db
        shm_size: 128mb
        volumes:
            - db_data_resto:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: pwd
            POSTGRES_DB: db_resto
        networks:
            resto_network:
                ipv4_address: 172.28.0.10

    app:
        build:
            context: ..
            dockerfile: dockers/Dockerfile
        container_name: resto_burger
        volumes:
            - ../src:/var/www/src
            - ../config:/var/www/config
            - ../templates:/var/www/templates
            - ../public:/var/www/public
            - ../migrations:/var/www/migrations
            - ../bin:/var/www/bin
            - ../.env:/var/www/.env
        depends_on:
            - db
        networks:
            resto_network:
                ipv4_address: 172.28.0.20

    nginx:
        image: nginx:latest
        container_name: nginx_resto_burger
        ports:
            - "8000:80"
        volumes:
            - ../public:/var/www/public
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            resto_network:
                ipv4_address: 172.28.0.30

volumes:
    db_data_resto:

networks:
    resto_network:
        name: moh-mor-network
        driver: bridge
        ipam:
            config:
                - subnet: 172.28.0.0/16
